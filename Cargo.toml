[package]
name = "powercycle"
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
ctrlc = "3.5.2"
powercycle-config = { path = "src/powercycle/config" }
powercycle-core = { path = "src/powercycle/core" }
powercycle-format = { version = "0.2.0", path = "src/powercycle/format" }
powercycle-patch = { path = "src/powercycle/patch" }
powercycle-search = { path = "src/powercycle/search" }

[[bin]]
name = "pc-search"
path = "src/powercycle/bin/pc-search.rs"

[[bin]]
name = "pc-patch"
path = "src/powercycle/bin/pc-patch.rs"

[[bin]]
name = "pc-export"
path = "src/powercycle/bin/pc-export.rs"

[[bin]]
name = "pc-scan"
path = "src/powercycle/bin/pc-scan.rs"

[workspace]
resolver = "3"
members = [
    "src/powercycle/config",
    "src/powercycle/core",
    "src/powercycle/format",
    "src/powercycle/search",
    "src/powercycle/patch",
]
exclude = [
    "src/verify/rust",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
